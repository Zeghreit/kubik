<title>Kubik UI Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a workbench. Variant rail on top, a live Kubik build in a device
   frame on the left, the brief on the right. On a phone or tablet the build
   fills the screen under the rail, so it can be judged at real size. */
@property --mc { syntax: '<color>'; inherits: true; initial-value: #f2f2f2; }
:root{
  color-scheme:dark;
  --lab-bg:#060708; --lab-panel:#0d0f12; --lab-fg:#dde2e7; --lab-dim:#7f8891; --lab-line:#1b1f25; --lab-acc:#c0fe04;
  --f-d:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --f-m:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--lab-bg);color:var(--lab-fg);font:14px/1.45 var(--f-d);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,[role=button]:focus-visible,input:focus-visible{outline:2px solid var(--lab-acc);outline-offset:2px}

#lab{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
#bar{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--lab-line);min-width:0;background:var(--lab-bg);position:relative;z-index:5}
.brand{font:800 12px var(--f-d);font-stretch:125%;letter-spacing:.08em;white-space:nowrap;text-transform:uppercase}
.brand span{color:var(--lab-dim);font-weight:500}
#variants{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;padding:2px}
#variants::-webkit-scrollbar{display:none}
#variants button{flex:none;display:flex;align-items:baseline;gap:7px;height:38px;padding:0 12px;border:1px solid var(--lab-line);background:var(--lab-panel);color:var(--lab-dim);font:500 11px var(--f-m);letter-spacing:.08em;text-transform:uppercase;transition:background .15s,color .15s,border-color .15s}
#variants button b{color:var(--lab-fg);font:800 15px var(--f-d);font-stretch:112%;transition:color .15s}
#variants button[aria-selected=true]{background:var(--lab-acc);border-color:var(--lab-acc);color:#060708}
#variants button[aria-selected=true] b{color:#060708}
.ctl{display:flex;gap:6px;flex:none}
.lseg{display:flex;border:1px solid var(--lab-line)}
.lseg button{height:36px;padding:0 10px;font:500 11px var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--lab-dim)}
.lseg button[aria-pressed=true]{background:var(--lab-fg);color:#060708}
#infoBtn{display:none;width:38px;height:38px;border:1px solid var(--lab-line);font:600 13px var(--f-m)}

#bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,390px);min-height:0}
#well{position:relative;min-width:0;min-height:0;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#121519 0%,#060708 70%)}
#well::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:linear-gradient(#1b1f25 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,#1b1f25 1px,transparent 1px) 0 0/40px 40px;
  -webkit-mask:radial-gradient(ellipse at center,#000 20%,transparent 75%);mask:radial-gradient(ellipse at center,#000 20%,transparent 75%)}
#device{position:absolute;left:50%;top:50%;flex:none;border-radius:46px;overflow:hidden;transform-origin:center center;
  box-shadow:0 0 0 9px #14171b,0 0 0 10px #2a2f36,0 50px 90px -30px rgb(0 0 0/.9)}
#device[data-device=tablet]{border-radius:26px}
#device[data-device=fill]{position:absolute;inset:0;border-radius:0;box-shadow:none;transform:none!important;width:auto!important;height:auto!important}
#brief{border-left:1px solid var(--lab-line);overflow:auto;padding:22px 22px 40px;background:var(--lab-panel);overscroll-behavior:contain;min-width:0}
.b-kick{font:500 11px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--lab-dim)}
#brief h1{font:900 34px/1 var(--f-d);font-stretch:125%;text-transform:uppercase;margin:6px 0 12px;text-wrap:balance;letter-spacing:-.01em}
#brief h3{font:600 11px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--lab-dim);margin:22px 0 8px}
#brief p{margin:0 0 10px;color:#c5ccd3;max-width:62ch}
#brief ul,#brief ol{margin:0;padding-left:18px;color:#c5ccd3}
#brief li{margin:0 0 6px}
#brief li::marker{color:var(--lab-dim)}
.refs a{color:var(--lab-fg);text-decoration:underline;text-decoration-color:#3a4048;text-underline-offset:3px}
.refs li span{color:var(--lab-dim)}
.b-close{display:none}

@media (max-width:980px){
  #bench{grid-template-columns:minmax(0,1fr)}
  #brief{position:fixed;left:0;right:0;bottom:0;max-height:78%;z-index:60;border-left:0;border-top:1px solid var(--lab-line);
    transform:translateY(102%);transition:transform .5s cubic-bezier(.32,.72,0,1);padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  #brief.open{transform:none}
  .b-close{display:block;position:sticky;top:0;margin-left:auto;width:44px;height:44px;border:1px solid var(--lab-line);background:var(--lab-panel);font:600 12px var(--f-m)}
  #infoBtn{display:block}
  .lseg.dev{display:none}
  .brand span{display:none}
  #variants button{padding:0 11px}
  #variants button:not([aria-selected=true]){font-size:0;gap:0}
}
@media (max-width:560px){ .brand{display:none} #bar{gap:8px;padding:6px 8px} .lseg button{padding:0 8px} }

/* ================= THE APP ================= */
#app{
  --bg1:#0e1115; --bg2:#040506; --plate:#101216; --plate2:#181b20; --press:#262a31;
  --ink:#f2f2f2; --inkd:#8e959c; --micro:#5d646b; --line:rgb(255 255 255/.09); --lines:rgb(255 255 255/.28);
  --vpt:#f2f2f2; --vpd:#7d858d;
  --signal:#f24723; --on:#060708;
  --m-obj:#f2f2f2; --m-vtx:#c0fe04; --m-edg:#01e8ff; --m-fce:#ff4fa3;
  --on-obj:#060708;
  --fd:var(--f-d); --fm:var(--f-m);
  --sat:0px; --sab:0px; --vt:120px; --vb:200px; --deckH:170px;
  --e-std:cubic-bezier(.2,0,0,1); --e-in:cubic-bezier(.05,.7,.1,1); --e-out:cubic-bezier(.3,0,.8,.15);
  --e-sheet:cubic-bezier(.32,.72,0,1); --e-spring:cubic-bezier(.3,1.3,.5,1);
  --mc:var(--m-obj); --mc-on:var(--on-obj);
  position:absolute;inset:0;overflow:hidden;border-radius:inherit;container:app/size;
  color:var(--ink);font-family:var(--fd);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  transition:--mc .15s linear;
}
#app[data-mode=vertex]{--mc:var(--m-vtx);--mc-on:#060708}
#app[data-mode=edge]{--mc:var(--m-edg);--mc-on:#060708}
#app[data-mode=face]{--mc:var(--m-fce);--mc-on:#060708}
#app button:focus-visible,#app [role=button]:focus-visible{outline:2px solid var(--mc);outline-offset:2px}
#app svg.ic{display:block;flex:none}

#stage{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 38%,var(--bg1) 0%,var(--bg2) 72%);
  transform-origin:50% 60%;transition:transform .5s var(--e-sheet),filter .5s var(--e-sheet),border-radius .5s var(--e-sheet),left .45s var(--e-sheet);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#chrome{position:absolute;inset:0;pointer-events:none;z-index:10}
#chrome > *{pointer-events:auto}
#chrome .passive{pointer-events:none}

/* overlays that follow the selection */
#ov{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .15s}
#ov.on{opacity:1}
#ov > *{display:none;position:absolute}
.brk{left:var(--x0);top:var(--y0);width:calc(var(--x1) - var(--x0));height:calc(var(--y1) - var(--y0))}
.brk i{position:absolute;width:14px;height:14px;border:0 solid var(--bc,var(--vpt))}
.brk i:nth-child(1){left:-12px;top:-12px;border-width:1.5px 0 0 1.5px}
.brk i:nth-child(2){right:-12px;top:-12px;border-width:1.5px 1.5px 0 0}
.brk i:nth-child(3){left:-12px;bottom:-12px;border-width:0 0 1.5px 1.5px}
.brk i:nth-child(4){right:-12px;bottom:-12px;border-width:0 1.5px 1.5px 0}
#ov.draw .brk i{animation:tick .3s var(--e-in) both}
@keyframes tick{from{opacity:0;transform:scale(1.8)}to{opacity:1;transform:none}}
.lead{inset:0;width:100%;height:100%;overflow:visible}
.lead line{stroke:var(--lc,var(--vpt));stroke-width:1}
.lead circle{fill:var(--lc,var(--vpt))}
.callout{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 10px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--vpt);transform:translateY(-50%)}
.callout b{display:inline-block;background:var(--mc);color:var(--mc-on);padding:3px 6px;margin-right:6px;font-weight:600}
.dim{left:var(--x0);top:calc(var(--y1) + 18px);width:calc(var(--x1) - var(--x0));height:1px;background:var(--vpt)}
.dim::before,.dim::after{content:"";position:absolute;top:-5px;width:1px;height:11px;background:var(--vpt)}
.dim::before{left:0}.dim::after{right:0}
.dim span{position:absolute;left:50%;top:6px;transform:translateX(-50%);font:600 10px var(--fm);letter-spacing:.1em;color:var(--vpt);white-space:nowrap}
.scale{left:18px;top:0;bottom:0;width:44px;clip-path:inset(calc(var(--sat) + 150px) 0 calc(var(--sab) + 70px) 0)}
.scale span{position:absolute;left:0;top:calc(var(--g) - var(--n) * var(--ppm));font:500 9.5px var(--fm);color:var(--vpd);letter-spacing:.06em;transform:translateY(-50%);padding-left:12px}
.scale span::before{content:"";position:absolute;left:0;top:50%;width:8px;height:1px;background:var(--vpd)}

/* scrim, panels */
#scrim{position:absolute;inset:0;z-index:28;background:rgb(0 0 0/.42);opacity:0;visibility:hidden;transition:opacity .4s var(--e-sheet),visibility 0s .4s}
#app[data-panel]:not([data-panel=""]) #scrim{opacity:1;visibility:visible;transition:opacity .5s var(--e-sheet)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:74%;display:flex;flex-direction:column;z-index:30;background:var(--plate);color:var(--ink);
  border-top:1px solid var(--lines);padding-bottom:calc(10px + var(--sab));
  transform:translateY(104%);visibility:hidden;transition:transform .4s var(--e-sheet),visibility 0s .4s}
#app[data-panel=scene] #p-scene,#app[data-panel=mat] #p-mat,#app[data-panel=menu] #p-menu{transform:none;visibility:visible;transition:transform .5s var(--e-sheet)}
.panel header{display:flex;align-items:center;gap:12px;padding:12px 8px 10px 16px}
.panel h2{margin:0;font:800 20px var(--fd);font-stretch:125%;text-transform:uppercase;letter-spacing:-.005em}
.panel .sub{font:500 10px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--inkd)}
.panel .px{margin-left:auto;width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
.plist{overflow:auto;overscroll-behavior:contain;min-height:0}
.prow{display:grid;grid-template-columns:30px minmax(0,1fr) auto 48px;align-items:center;min-height:52px;padding-left:16px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.prow i{font:500 10px var(--fm);font-style:normal;color:var(--micro)}
.prow b{font:600 15px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{font:500 10px var(--fm);letter-spacing:.08em;color:var(--inkd);padding-right:6px}
.prow .eye{width:48px;height:52px;display:grid;place-items:center;color:var(--inkd)}
.prow.sel{background:var(--mc);color:var(--mc-on)}
.prow.sel i,.prow.sel small,.prow.sel .eye{color:inherit;opacity:.72}
.prow.hid b{opacity:.5;text-decoration:line-through}
.pfoot{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px 0}
.pfoot button,.mseg button{height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;background:var(--plate2);font:600 11px var(--fm);letter-spacing:.08em;text-transform:uppercase}
.pfoot button:disabled{opacity:.4;cursor:default}
.pfoot .danger{color:var(--signal);margin-left:auto}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;padding:4px 12px 6px;overflow:auto;overscroll-behavior:contain}
.mcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;background:var(--plate2);text-align:left;min-height:118px;border:1px solid transparent;transition:border-color .15s,background .15s}
.mcard.on{border-color:var(--mc)}
.mcard b{font:700 13px var(--fd)}
.mcard small{font:500 10px var(--fm);color:var(--inkd);letter-spacing:.06em}
.sw{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--sw) 30%,#fff) 0%,var(--sw) 38%,color-mix(in srgb,var(--sw) 45%,#000) 100%);box-shadow:0 8px 16px -8px rgb(0 0 0/.6)}
.sw.metal{background:radial-gradient(circle at 34% 30%,#fff 0%,var(--sw) 22%,#5a5f66 55%,#e9edf2 72%,#3a3e44 100%)}
.mbody{padding:0 16px 8px;overflow:auto;overscroll-behavior:contain}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-top:1px solid var(--line);font:600 14px var(--fd)}
.mseg{display:flex;gap:4px}
.mseg button.on{background:var(--mc);color:var(--mc-on)}
.tog{width:52px;height:32px;border:1px solid var(--lines);position:relative;flex:none}
.tog i{position:absolute;left:3px;top:3px;width:24px;height:24px;background:var(--inkd);transition:transform .2s var(--e-std),background .15s}
.tog.on i{transform:translateX(20px);background:var(--mc)}
.mnote{font:500 11px/1.5 var(--fm);color:var(--inkd);margin:14px 0 4px;letter-spacing:.02em}

/* operation deck */
#opdeck{position:absolute;left:0;right:0;bottom:var(--deckH);z-index:20;background:var(--plate);color:var(--ink);padding:12px 12px 12px;border-top:1px solid var(--lines);
  opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .15s var(--e-out),transform .2s var(--e-out),visibility 0s .2s}
#app[data-op]:not([data-op=""]) #opdeck{opacity:1;visibility:visible;transform:none;transition:opacity .2s var(--e-in),transform .3s var(--e-in)}
.op-head{display:flex;align-items:flex-end;gap:12px}
.op-val{width:4.6ch;background:none;border:0;color:inherit;font:800 44px/.9 var(--fd);font-stretch:125%;font-variant-numeric:tabular-nums;padding:0;letter-spacing:-.02em;outline:none;-webkit-user-select:text;user-select:text}
.op-meta{display:flex;flex-direction:column;gap:3px;padding-bottom:3px;min-width:0}
.op-kick{font:500 9.5px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--micro)}
.op-name{font:800 14px var(--fd);font-stretch:112%;letter-spacing:.06em;text-transform:uppercase}
.op-hint{margin-left:auto;font:500 9.5px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--micro);text-align:right;padding-bottom:3px}
.op-ruler{position:relative;height:46px;margin-top:6px;touch-action:none;cursor:ew-resize;
  background:repeating-linear-gradient(90deg,var(--lines) 0 1px,transparent 1px 10px) 0 28px/100% 10px no-repeat,
             repeating-linear-gradient(90deg,var(--lines) 0 1px,transparent 1px 50px) 0 22px/100% 16px no-repeat}
.op-ruler .fill{position:absolute;left:0;top:22px;height:16px;width:calc(var(--opp,0) * 100%);background:var(--mc)}
.op-ruler .needle{position:absolute;top:8px;bottom:0;left:calc(var(--opp,0) * 100%);width:2px;margin-left:-1px;background:var(--ink)}
.op-ruler .needle::before{content:"";position:absolute;left:-5px;top:-7px;border:6px solid transparent;border-top-color:var(--ink)}
.op-arc{display:none}
.op-row{display:flex;gap:4px;margin-top:8px;align-items:stretch}
.op-seg{display:flex;gap:4px}
.op-seg button{height:48px;padding:0 14px;background:var(--plate2);color:var(--inkd);font:600 11px var(--fm);letter-spacing:.08em;text-transform:uppercase}
.op-seg button.on{background:var(--ink);color:var(--plate)}
#app[data-op=inset] .op-seg{visibility:hidden}
.op-x{width:52px;height:48px;display:grid;place-items:center;background:var(--plate2);margin-left:auto}
.op-ok{height:48px;padding:0 34px 0 18px;background:var(--signal);color:#060708;font:800 14px var(--fd);font-stretch:112%;letter-spacing:.08em;text-transform:uppercase;position:relative;overflow:hidden}
.op-ok::after{content:"";position:absolute;right:0;top:0;bottom:0;width:16px;background:repeating-linear-gradient(135deg,rgb(0 0 0/.55) 0 3px,transparent 3px 7px)}

/* sym popover */
.pop{position:absolute;z-index:25;display:grid;grid-template-columns:repeat(3,52px);gap:4px;padding:6px;background:var(--plate);border:1px solid var(--lines);
  transition:opacity .15s var(--e-out),transform .2s var(--e-out)}
.pop:not(.vis){opacity:0;transform:scale(.95);pointer-events:none!important}
.pop.vis{transition:opacity .2s var(--e-in),transform .25s var(--e-in)}
.pop button{height:48px;background:var(--plate2);font:700 15px var(--fm);color:var(--ink)}
.pop button.on{background:var(--mc);color:var(--mc-on)}

/* tool ring */
#ring{position:absolute;inset:0;z-index:40;pointer-events:none}
#ring.open{pointer-events:auto}
#ring .veil{position:absolute;inset:0;background:radial-gradient(circle at var(--cx) var(--cy),rgb(0 0 0/.55) 0,rgb(0 0 0/.18) calc(var(--r) * 2.2));opacity:0;transition:opacity .15s}
#ring.open .veil{opacity:1}
.seat{position:absolute;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;display:grid;place-items:center;text-align:center;padding:6px;
  font:700 10px/1.1 var(--fd);font-stretch:112%;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--plate);border:1px solid var(--lines);
  transform:translate(var(--cx),var(--cy)) scale(.9);opacity:0;
  transition:transform .16s var(--e-in) calc(var(--i) * 22ms),opacity .16s linear calc(var(--i) * 22ms),background .12s,color .12s}
#ring.open .seat{transform:translate(var(--x),var(--y)) scale(1);opacity:1}
#ring.closing .seat{transition:transform .1s var(--e-out),opacity .1s;transition-delay:0s}
#ring .seat.hot{background:var(--mc);color:var(--mc-on);border-color:var(--mc);transform:translate(var(--x),var(--y)) scale(1.1)}
.seat.danger{color:var(--signal);border-color:var(--signal)}
#ring .seat.danger.hot{background:var(--signal);color:#060708}
.seat .hold{position:absolute;inset:0;background:var(--signal);transform-origin:left;transform:scaleX(0);mix-blend-mode:screen;opacity:.8}
.seat.holding .hold{transform:scaleX(1);transition:transform .55s linear}
.rhub{position:absolute;left:var(--cx);top:var(--cy);width:12px;height:12px;margin:-6px;border:1.5px solid var(--ink);transform:rotate(45deg) scale(.4);opacity:0;transition:.15s}
#ring.open .rhub{opacity:1;transform:rotate(45deg) scale(1)}
.rlabel{position:absolute;left:var(--cx);top:calc(var(--cy) - var(--r) - 66px);transform:translateX(-50%);font:600 10px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--vpt);white-space:nowrap;opacity:0;transition:opacity .15s}
#ring.open .rlabel{opacity:1}

/* toast */
#toast{position:absolute;left:50%;top:calc(var(--sat) + 86px);z-index:45;transform:translate(-50%,-6px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--plate);padding:8px 12px;font:600 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
  max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;transition:opacity .15s var(--e-out),transform .2s var(--e-out)}
#toast.on{opacity:1;transform:translate(-50%,0);transition:opacity .2s var(--e-in),transform .3s var(--e-in)}
#toast.blink{animation:blink .5s steps(1) 1}
@keyframes blink{0%{opacity:0}25%{opacity:1}50%{opacity:0}75%{opacity:1}}

/* shared mode chips */
.m-object{--c:var(--m-obj);--on-c:var(--on-obj)} .m-vertex{--c:var(--m-vtx);--on-c:#060708}
.m-edge{--c:var(--m-edg);--on-c:#060708} .m-face{--c:var(--m-fce);--on-c:#060708}

#app.lite *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#app[data-layout=depth][data-panel]:not([data-panel=""]) #ov,#app[data-skin=h][data-panel]:not([data-panel=""]):not([data-panel=scene]) #ov{opacity:0}

@media (prefers-reduced-motion:reduce){
  #app *,#app{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ================= LAYOUT: DECK (G, H, I) ================= */
#app[data-layout=deck]{--vt:110px;--vb:175px;--deckH:calc(166px + var(--sab))}
.d-top{position:absolute;left:12px;right:12px;top:calc(var(--sat) + 8px);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.d-top > *{pointer-events:auto}
.d-mode{display:flex;height:52px;min-width:0;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.d-mode .blk{display:flex;flex-direction:column;justify-content:center;padding:0 14px 0 12px;background:var(--mc);color:var(--mc-on);min-width:68px}
.d-mode .blk b{font:800 21px/1 var(--fd);font-stretch:125%;letter-spacing:-.01em}
.d-mode .blk span{font:600 9.5px var(--fm);letter-spacing:.14em;margin-top:4px;opacity:.72}
.d-mode .nm{display:flex;flex-direction:column;justify-content:center;padding:0 18px 0 12px;background:var(--plate);border:1px solid var(--line);border-left:0;min-width:0}
.d-mode .nm b{font:700 15px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.d-mode .nm span{font:500 10px var(--fm);letter-spacing:.08em;color:var(--inkd);text-transform:uppercase;margin-top:2px;white-space:nowrap}
.d-ib{width:52px;height:52px;display:grid;place-items:center;background:var(--plate);border:1px solid var(--line);color:var(--ink);flex:none;position:relative}
.d-ib::before,.d-ib::after{content:"";position:absolute;width:7px;height:7px;background:linear-gradient(var(--lines),var(--lines)) center/1px 100% no-repeat,linear-gradient(var(--lines),var(--lines)) center/100% 1px no-repeat}
.d-ib::before{left:-4px;top:-4px}.d-ib::after{right:-4px;bottom:-4px}
.d-ib.on{background:var(--ink);color:var(--plate)}
.d-coords{position:absolute;left:14px;top:calc(var(--sat) + 70px);font:500 9.5px var(--fm);letter-spacing:.14em;color:var(--vpd);text-transform:uppercase;pointer-events:none}
.d-deck{position:absolute;left:0;right:0;bottom:0;background:var(--plate);border-top:1px solid var(--lines);padding:10px 12px calc(12px + var(--sab))}
.d-head{display:flex;justify-content:space-between;gap:8px;font:500 9.5px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--micro)}
.d-ticks{height:9px;margin:6px 0 8px;background:repeating-linear-gradient(90deg,var(--lines) 0 1px,transparent 1px 8px);opacity:.5}
.d-modes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.d-modes button{height:52px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 10px;background:var(--plate2);color:var(--inkd);font:800 14px var(--fd);font-stretch:112%;text-transform:uppercase;position:relative;transition:background .15s,color .15s}
.d-modes button i{font:500 9.5px var(--fm);font-style:normal;letter-spacing:.12em;color:var(--micro);margin-bottom:2px}
.d-modes button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c)}
.d-modes button.on{background:var(--c);color:var(--on-c)}
.d-modes button.on i{color:inherit;opacity:.65}
.d-tools{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.d-tools button{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--plate2);font:600 9.5px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);transition:background .15s,color .15s}
.d-tools button em{font-style:normal;color:var(--mc)}
.d-tools button.on{background:var(--mc);color:var(--mc-on)}
.d-tools button.on em{color:inherit}
.d-tools button:disabled{color:var(--micro);cursor:default}
.d-tools button:active:not(:disabled),.d-modes button:active{box-shadow:inset 0 0 0 1px var(--lines);transform:translateY(1px)}
.d-deck .sympop{left:50%;margin-left:-87px;bottom:calc(100% + 10px)}
#app[data-layout=deck] #ov .brk{display:block}
#app[data-layout=deck] #ov .lead,#app[data-layout=deck] #ov .callout{display:block}
#app[data-layout=deck] .brk i{width:9px;height:9px;border-width:0!important;background:linear-gradient(var(--vpt),var(--vpt)) center/1px 100% no-repeat,linear-gradient(var(--vpt),var(--vpt)) center/100% 1px no-repeat}
#app[data-layout=deck] .brk i:nth-child(1){left:-18px;top:-18px}#app[data-layout=deck] .brk i:nth-child(2){right:-18px;top:-18px}
#app[data-layout=deck] .brk i:nth-child(3){left:-18px;bottom:-18px}#app[data-layout=deck] .brk i:nth-child(4){right:-18px;bottom:-18px}
#app[data-layout=deck] .seat{width:78px;height:78px;margin:-39px 0 0 -39px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border:0;background:var(--lines)}
#app[data-layout=deck] .seat::before{content:"";position:absolute;inset:1.5px;clip-path:inherit;background:var(--plate);z-index:-1}
#app[data-layout=deck] .seat{isolation:isolate}
#app[data-layout=deck] .seat.hot::before{background:var(--mc)}
#app[data-layout=deck] .seat.danger{background:var(--signal)}
#app[data-layout=deck] .seat.danger.hot::before{background:var(--signal)}
@container app (min-width:820px){
  #app[data-layout=deck]{--vt:90px;--vb:40px}
  #app[data-layout=deck] #stage{left:300px}
  #app[data-layout=deck] #p-scene{left:0;top:0;bottom:0;right:auto;width:300px;max-height:none;transform:none;visibility:visible;border-top:0;border-right:1px solid var(--lines);padding-top:calc(var(--sat) + 4px)}
  #app[data-layout=deck] .t-scene{display:none!important}
  #app[data-layout=deck] .d-top{left:312px}
  #app[data-layout=deck] .d-coords{left:314px}
  #app[data-layout=deck] .d-deck{left:auto;right:16px;bottom:16px;width:280px;border:1px solid var(--lines)}
  #app[data-layout=deck] .d-tools{grid-template-columns:repeat(4,1fr)}
  #app[data-layout=deck] #opdeck{left:316px;right:auto;width:440px;bottom:16px;border:1px solid var(--lines)}
  #app[data-layout=deck] .panel:not(#p-scene){left:auto;right:16px;width:380px;bottom:16px;border:1px solid var(--lines)}
  #app[data-layout=deck][data-panel=scene] #scrim{opacity:0;visibility:hidden}
}

/* ---- G · Ночь ---- */
#app[data-skin=g]{--bg1:#0f1216;--bg2:#040506}
/* ---- H · Кость ---- */
#app[data-skin=h]{--plate:#e8e6df;--plate2:#d9d6cd;--press:#c9c5ba;--ink:#0b0c0e;--inkd:#55585d;--micro:#86888c;--line:rgb(0 0 0/.12);--lines:rgb(0 0 0/.45);--bg1:#10131a;--bg2:#040506}
#app[data-skin=h] .d-modes .m-object.on{background:var(--ink);color:var(--plate)}
#app[data-skin=h][data-panel]:not([data-panel=""]) #stage{transform:scale(.955);border-radius:10px}
@container app (min-width:820px){#app[data-skin=h][data-panel=scene] #stage{transform:none;border-radius:0}}
/* ---- I · Бумага ---- */
#app[data-skin=i]{--bg1:#e7e6e1;--bg2:#c9c9c2;--plate:#f6f5f0;--plate2:#e8e7e1;--press:#d7d6cf;--ink:#0b0c0e;--inkd:#55585d;--micro:#8a8c90;--line:rgb(0 0 0/.1);--lines:rgb(0 0 0/.45);
  --vpt:#0b0c0e;--vpd:#5f6166;--m-obj:#0b0c0e;--on-obj:#f6f5f0}
#app[data-skin=i] #scrim{background:rgb(40 40 36/.25)}

/* ================= LAYOUT: FRAME (J · Телеметрия) ================= */
#app[data-layout=frame]{--bg1:#0b0c0e;--bg2:#060708;--plate:#0e1013;--plate2:#15181c;--press:#20242a;--line:#2b3037;--lines:#5c636b;--fd:var(--f-m);
  --vt:110px;--vb:120px;--deckH:calc(64px + var(--sab))}
.j-frame{position:absolute;left:10px;right:10px;top:calc(var(--sat) + 30px);bottom:calc(var(--sab) + 32px);border:1px solid var(--line);pointer-events:none!important;transition:border-color .15s}
#app[data-layout=frame]:not([data-mode=object]) .j-frame{border-color:var(--mc)}
.j-tabs{position:absolute;left:10px;top:calc(var(--sat) + 8px);display:flex}
.j-tabs button,.j-tools button,.j-menu{height:44px;min-width:48px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--plate);border:1px solid var(--line);margin-left:-1px;
  font:600 11px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--inkd);transition:background .15s,color .15s,border-color .15s}
.j-tabs button.on{background:var(--c);border-color:var(--c);color:var(--on-c)}
.j-menu{position:absolute;right:10px;top:calc(var(--sat) + 8px);color:var(--ink)}
.j-menu.on,.j-tools button.on{background:var(--ink);color:var(--plate);border-color:var(--ink)}
.j-ro{position:absolute;left:22px;top:calc(var(--sat) + 66px);display:flex;flex-direction:column;gap:2px;font:500 10px/1.5 var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--inkd);pointer-events:none}
.j-ro b{color:var(--ink);font-weight:600}
.j-tools{position:absolute;left:10px;right:10px;bottom:calc(var(--sab) + 8px);display:flex}
.j-tools button{height:52px;flex:1;color:var(--ink)}
.j-tools button:disabled{color:var(--micro)}
.j-tools button em{font-style:normal;color:var(--mc)}
.j-tools button:active:not(:disabled),.j-tabs button:active{background:var(--press);border-color:var(--lines)}
#app[data-layout=frame] .sympop{left:50%;margin-left:-87px;bottom:calc(var(--sab) + 70px)}
#app[data-layout=frame] #ov .brk,#app[data-layout=frame] #ov .dim,#app[data-layout=frame] #ov .scale{display:block}
#app[data-layout=frame] #opdeck{left:10px;right:10px;border:1px solid var(--lines);bottom:calc(var(--sab) + 60px)}
#app[data-layout=frame] .op-val{font:500 40px/1 var(--f-m);letter-spacing:-.03em;width:5.2ch}
#app[data-layout=frame] .op-ok{padding:0 18px;font:600 12px var(--f-m);letter-spacing:.14em}
#app[data-layout=frame] .op-ok::after{display:none}
#app[data-layout=frame] .panel{left:10px;right:10px;bottom:calc(var(--sab) + 60px);border:1px solid var(--lines);max-height:66%}
#app[data-layout=frame] .panel h2{font:600 13px var(--f-m);letter-spacing:.14em}
#app[data-layout=frame] .prow b{font:500 13px var(--f-m)}
#app[data-layout=frame] #scrim{background:rgb(0 0 0/.25)}
#app[data-layout=frame] .seat{width:92px;height:44px;margin:-22px 0 0 -46px;font:600 10px var(--f-m);letter-spacing:.12em;border-color:var(--lines)}
#app[data-layout=frame] #toast{top:calc(var(--sat) + 44px)}
@container app (min-width:820px){
  #app[data-layout=frame]{--vt:80px;--vb:80px}
  #app[data-layout=frame] #stage{left:326px}
  #app[data-layout=frame] #p-scene{left:16px;top:calc(var(--sat) + 30px);bottom:calc(var(--sab) + 32px);right:auto;width:300px;max-height:none;transform:none;visibility:visible}
  #app[data-layout=frame] .t-scene{display:none!important}
  #app[data-layout=frame] .j-frame{left:16px;right:16px}
  #app[data-layout=frame] .j-tabs{left:340px}
  #app[data-layout=frame] .j-ro{left:340px}
  #app[data-layout=frame] .j-tools{left:auto;right:16px;width:440px}
  #app[data-layout=frame] #opdeck{left:340px;right:auto;width:460px;bottom:calc(var(--sab) + 32px)}
  #app[data-layout=frame] .panel:not(#p-scene){left:auto;right:16px;width:380px}
  #app[data-layout=frame][data-panel=scene] #scrim{opacity:0;visibility:hidden}
  #app[data-layout=frame] .scale{left:342px}
}

/* ================= LAYOUT: POSTER (K · Этикетки) ================= */
#app[data-layout=poster]{--bg1:#101114;--bg2:#050506;--plate:#ebe8df;--plate2:#dcd9cf;--press:#c9c5ba;--ink:#0c0d0f;--inkd:#56585c;--micro:#8a8880;--line:rgb(0 0 0/.12);--lines:rgb(0 0 0/.5);
  --vt:190px;--vb:120px;--deckH:calc(92px + var(--sab))}
.k-word{position:absolute;left:12px;top:calc(var(--sat) + 6px);font:900 96px/.8 var(--f-d);font-stretch:125%;letter-spacing:-.035em;color:var(--mc);text-transform:uppercase;pointer-events:none!important;transition:color .15s}
.k-word .l{display:none}
.k-lab{position:absolute;left:12px;top:calc(var(--sat) + 96px);max-width:calc(100% - 110px);display:flex;align-items:center;gap:10px;height:46px;padding:0 16px 0 12px;background:var(--plate);color:var(--ink);
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);pointer-events:none!important}
.k-lab b{font:800 15px var(--f-d);font-stretch:112%;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-lab small{font:500 10px var(--f-m);letter-spacing:.1em;color:var(--inkd);text-transform:uppercase;white-space:nowrap}
.k-bar{display:block;height:22px;flex:none}
.k-side{position:absolute;right:0;top:calc(var(--sat) + 8px);display:flex;flex-direction:column;gap:4px}
.k-side button{width:80px;height:54px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 10px;background:var(--plate);color:var(--ink);
  font:800 13px var(--f-d);font-stretch:112%;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px);transition:transform .15s var(--e-std),background .15s}
.k-side button small{font:500 9.5px var(--f-m);letter-spacing:.1em;color:var(--inkd);text-transform:uppercase}
.k-side button:first-child{margin-bottom:84px}
.k-side button.on{background:var(--mc);color:var(--mc-on);transform:translateX(-6px)}
.k-side button.on small{color:inherit}
.k-side button:disabled{color:#a09d94}
.k-side button:active:not(:disabled){transform:translateX(-3px);background:var(--press)}
.k-modes{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 14px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.k-modes button{height:66px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:8px 10px;background:var(--c);color:var(--on-c);
  font:900 17px var(--f-d);font-stretch:125%;text-transform:uppercase;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);opacity:.38;transition:opacity .15s,transform .2s var(--e-std)}
.k-modes button small{font:600 9.5px var(--f-m);letter-spacing:.12em;margin-bottom:auto}
.k-modes button.on{opacity:1;transform:translateY(-6px)}
#app[data-skin=k] .k-modes .m-object{--c:#ebe8df}
#app[data-skin=k]{--m-obj:#ebe8df}
#app[data-layout=poster] .sympop{right:88px;top:calc(var(--sat) + 330px);background:var(--plate)}
#app[data-layout=poster] #ov .lead,#app[data-layout=poster] #ov .callout{display:block}
#app[data-layout=poster] .callout{font:800 12px var(--f-d);font-stretch:112%;letter-spacing:.02em;background:var(--plate);color:var(--ink);padding:6px 10px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
#app[data-layout=poster] .callout b{font:600 10px var(--f-m);letter-spacing:.1em}
#app[data-layout=poster] #opdeck{left:12px;right:12px;border:0;padding:14px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);bottom:calc(var(--sab) + 96px)}
#app[data-layout=poster] .op-val{font:900 58px/.82 var(--f-d);font-stretch:125%;width:4.2ch;letter-spacing:-.03em}
#app[data-layout=poster] .op-name{font:900 18px var(--f-d);font-stretch:125%}
#app[data-layout=poster] .op-ruler{background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 9px) 0 16px/100% 24px no-repeat}
#app[data-layout=poster] .op-ruler .fill{top:16px;height:24px;mix-blend-mode:multiply}
#app[data-layout=poster] .panel{left:12px;right:12px;bottom:calc(var(--sab) + 96px);border:0;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);max-height:62%}
#app[data-layout=poster] .panel h2{font:900 26px var(--f-d);font-stretch:125%}
#app[data-layout=poster] #scrim{background:rgb(0 0 0/.3)}
#app[data-layout=poster] .seat{width:96px;height:48px;margin:-24px 0 0 -48px;border:0;background:var(--plate);color:var(--ink);font:800 12px var(--f-d);font-stretch:112%;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
#app[data-layout=poster] .seat.danger{background:var(--signal);color:#060708}
#app[data-layout=poster] #toast{top:auto;bottom:calc(var(--sab) + 104px)}
@container app (min-width:820px){
  #app[data-layout=poster]{--vt:140px;--vb:110px}
  #app[data-layout=poster] .k-word{font-size:170px}
  #app[data-layout=poster] .k-word .s{display:none}#app[data-layout=poster] .k-word .l{display:inline}
  #app[data-layout=poster] .k-lab{top:calc(var(--sat) + 150px);left:18px}
  #app[data-layout=poster] .k-modes{left:auto;right:100px;width:520px}
  #app[data-layout=poster] #opdeck{left:24px;right:auto;width:460px;bottom:calc(var(--sab) + 24px)}
  #app[data-layout=poster] .panel{left:auto;right:96px;width:400px;top:calc(var(--sat) + 8px);bottom:auto}
}

/* ================= LAYOUT: VECTOR (L · Вектор) ================= */
#app[data-layout=vector]{--bg1:#0a0b0e;--bg2:#050506;--plate:rgb(8 9 11/.94);--plate2:rgb(230 236 242/.05);--press:rgb(230 236 242/.12);--line:rgb(230 236 242/.14);--lines:rgb(230 236 242/.3);
  --ink:#e6ecf2;--inkd:#86909b;--vt:120px;--vb:200px;--deckH:calc(190px + var(--sab))}
.l-name{position:absolute;left:22px;top:calc(var(--sat) + 14px);right:80px;pointer-events:none!important}
.l-name b{display:block;font:300 32px/1 var(--f-d);font-stretch:62%;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);transition:color .15s}
#app[data-layout=vector]:not([data-mode=object]) .l-name b{color:var(--mc)}
.l-name small{display:block;font:400 10px var(--f-m);letter-spacing:.14em;color:var(--inkd);margin-top:8px;text-transform:uppercase}
.l-o{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:border-color .15s,background .15s,color .15s}
.l-o.on{background:var(--ink);color:#060708;border-color:var(--ink)}
.l-o:active:not(:disabled){border-color:var(--ink);background:var(--press)}
.l-o:disabled{color:#4a525b;cursor:default}
.l-menu{position:absolute;right:18px;top:calc(var(--sat) + 12px)}
.l-col{position:absolute;left:18px;top:calc(var(--sat) + 92px);display:flex;flex-direction:column;gap:8px}
.l-arc{position:absolute;left:50%;bottom:calc(var(--sab) + 84px);width:300px;height:150px;margin-left:-150px;--ox:150px;--oy:150px;--rr:140px}
.l-arc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.l-arc svg path{fill:none;stroke:var(--line);stroke-width:1}
.l-arc .arc-t{display:none}
.l-m{position:absolute;left:calc(var(--ox) + var(--rr) * cos(var(--aa) * 1deg));top:calc(var(--oy) - var(--rr) * sin(var(--aa) * 1deg));--aa:var(--a);
  width:64px;height:52px;margin:-26px 0 0 -32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:500 11px var(--f-d);font-stretch:62%;letter-spacing:.32em;text-transform:uppercase;color:var(--inkd)}
.l-m i{width:8px;height:8px;border:1px solid var(--inkd);border-radius:50%;transition:transform .2s var(--e-spring),background .15s,border-color .15s}
.l-m.on{color:var(--c)}
.l-m.on i{background:var(--c);border-color:var(--c);transform:scale(1.6)}
.l-hist{position:absolute;left:50%;bottom:calc(var(--sab) + 24px);display:flex;gap:10px;transform:translateX(-50%)}
#app[data-layout=vector] .sympop{left:74px;top:calc(var(--sat) + 196px);border-radius:28px;background:var(--plate)}
#app[data-layout=vector] .pop button{border-radius:50%;border:1px solid var(--line);background:none}
#app[data-layout=vector] .pop button.on{background:var(--mc);border-color:var(--mc)}
#app[data-layout=vector] #ov .brk{display:block}
#app[data-layout=vector] .brk i{border-color:var(--mc);width:10px;height:10px}
#app[data-layout=vector] #ov .lead,#app[data-layout=vector] #ov .callout{display:block}
#app[data-layout=vector] .callout{font:400 10px var(--f-m);letter-spacing:.14em}
#app[data-layout=vector] .callout b{background:none;color:var(--mc);border:1px solid var(--mc);border-radius:10px;padding:2px 8px}

/* ---------------- polygon meshes ---------------- */
function polyBox(sx, sy, sz) {
  const x = sx / 2, y = sy / 2, z = sz / 2;
  const v = [[-x, -y, -z], [x, -y, -z], [x, y, -z], [-x, y, -z], [-x, -y, z], [x, -y, z], [x, y, z], [-x, y, z]].map(a => new V3(...a));
  return { v, f: [[4, 5, 6, 7], [1, 0, 3, 2], [0, 4, 7, 3], [5, 1, 2, 6], [7, 6, 2, 3], [0, 1, 5, 4]] };
}
function polyCyl(r, h, n) {
  const v = [];
  for (let k = 0; k < 2; k++) for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; v.push(new V3(Math.cos(a) * r, k ? h / 2 : -h / 2, Math.sin(a) * r)); }

}
function polyIco(r) {
  const g = new THREE.IcosahedronGeometry(r, 0), p = g.attributes.position, v = [], map = new Map(), f = [];

      const q = new V3().fromBufferAttribute(p, t + k), key = q.toArray().map(x => x.toFixed(4)).join();
      if (!map.has(key)) { map.set(key, v.length); v.push(q); }
      face.push(map.get(key));
    }
    f.push(face);
  }

  return { v, f };
}
function clonePoly(p) { return { v: p.v.map(q => q.clone()), f: p.f.map(a => a.slice()) }; }
function faceNormal(v, f) {

}

function edgesOf(p) {

  return [...m.values()];
}
function compact(p) {
  const used = new Map(), v = [];
  const f = p.f.map(face => face.map(i => { if (!used.has(i)) { used.set(i, v.length); v.push(p.v[i]); } return used.get(i); }));
  return { v, f };
}
function buildGeo(p) {
  const pos = [], tri2f = [];
  p.f.forEach((f, fi) => { for (let k = 1; k < f.length - 1; k++) { for (const idx of [f[0], f[k], f[k + 1]]) { const q = p.v[idx]; pos.push(q.x, q.y, q.z); } tri2f.push(fi); } });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals(); g.computeBoundingBox(); g.computeBoundingSphere();
  g.userData.tri2f = tri2f;
  return g;
}
function extrude(base, faces, d, region) {
  const v = base.v.map(q => q.clone()), f = base.f.map(a => a.slice()), newSel = [];
  if (!region) {
    for (const fi of faces) {
      const face = f[fi], n = faceNormal(v, face);
      const map = face.map(i => { v.push(v[i].clone().addScaledVector(n, d)); return v.length - 1; });
      for (let k = 0; k < face.length; k++) { const k2 = (k + 1) % face.length; f.push([face[k], face[k2], map[k2], map[k]]); }
      f[fi] = map; newSel.push(fi);
    }
  } else {
    const dir = new Map(), n = new V3();
    for (const fi of faces) { const face = f[fi]; n.add(faceNormal(v, face)); face.forEach((a, k) => { const b = face[(k + 1) % face.length]; dir.set(a + '_' + b, [a, b]); }); }

    for (let k = 0; k < face.length; k++) { const k2 = (k + 1) % face.length; f.push([face[k], face[k2], map[k2], map[k]]); }

/* ---------------- three ---------------- */
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, .05, 200);
const controls = new OrbitControls(camera, cv);
controls.enableDamping = true; controls.dampingFactor = .1; controls.rotateSpeed = .85;
controls.minDistance = 2.2; controls.maxDistance = 22; controls.maxPolarAngle = Math.PI * .495;
controls.mouseButtons.RIGHT = null;
controls.target.set(0, .5, 0);
camera.position.setFromSphericalCoords(8.5, THREE.MathUtils.degToRad(63), THREE.MathUtils.degToRad(36)).add(controls.target);

const key = new THREE.DirectionalLight('#ffffff', 1.6);
key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.radius = 5;
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: .5, far: 24 });
key.shadow.bias = -.0004; key.shadow.normalBias = .02;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight('#9fb4ff', 0); scene.add(rim);
const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: .45 }));
shadowPlane.receiveShadow = true; scene.add(shadowPlane);
const gridMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uColor: { value: new THREE.Color('#fff') }, uAlpha: { value: .07 }, uFade: { value: 11 } },
  vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: `uniform vec3 uColor; uniform float uAlpha; uniform float uFade; varying vec3 vW;
    float gl2(vec2 p, float s){ vec2 q = p / s; vec2 g = abs(fract(q - .5) - .5) / fwidth(q); return 1. - min(min(g.x, g.y), 1.); }
    void main(){ float a = gl2(vW.xz, .5) * .55 + gl2(vW.xz, 2.5) * 1.; float d = length(vW.xz); a *= 1. - smoothstep(uFade * .3, uFade, d); if (a < .01) discard; gl_FragColor = vec4(uColor, a * uAlpha * 4.); }`,
});
const grid = new THREE.Mesh(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), gridMat);
grid.position.y = .001; grid.renderOrder = -1; scene.add(grid);

const matCache = {};
function matFor(o) {
  const k = o.mat + (S.xray ? '_x' : '');
  if (!matCache[k]) {
    const d = MATS[o.mat];
    matCache[k] = new THREE.MeshStandardMaterial({ color: d.c, roughness: d.r, metalness: d.m, flatShading: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
      transparent: S.xray, opacity: S.xray ? .32 : 1, depthWrite: !S.xray });

  return matCache[k];

let nextId = 1;
const objs = [];
const byId = id => objs.find(o => o.id === id);
const cur = () => { const o = byId(S.sel); return o && !o.hidden ? o : null; };
function makeObj(name, poly, pos, mat, id) {

  if (id != null) nextId = Math.max(nextId, id + 1);
  o.mesh = new THREE.Mesh(buildGeo(poly), matFor(o));
  o.mesh.position.set(...pos); o.mesh.castShadow = true; o.mesh.receiveShadow = true; o.mesh.userData.oid = o.id;
  scene.add(o.mesh); objs.push(o);
  return o;
}
function refreshGeo(o) { o.mesh.geometry.dispose(); o.mesh.geometry = buildGeo(o.poly); }
function removeObj(o) {

makeObj('Plate', polyBox(2.6, .08, 1.8), [0, .04, 0], 'graphite');
makeObj('Cube 1', polyBox(1, 1, 1), [0, .58, 0], 'clay');
makeObj('Tube 2', polyCyl(.32, 1.1, 10), [1.85, .55, -.35], 'chrome');
makeObj('Ico 3', polyIco(.44), [-1.75, .37, -.15], 'bone');
S.sel = 2;

/* selection helpers */
const lineMat = new LineMaterial({ linewidth: 1.8, vertexColors: true, worldUnits: false, depthTest: true });
let selLines = new LineSegments2(new LineSegmentsGeometry(), lineMat);
selLines.renderOrder = 3;
const ptsMat = new THREE.PointsMaterial({ size: 8, sizeAttenuation: false, vertexColors: true });
const selPts = new THREE.Points(new THREE.BufferGeometry(), ptsMat); selPts.renderOrder = 4;
const faceMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: .55, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, side: THREE.DoubleSide });
const faceHi = new THREE.Mesh(new THREE.BufferGeometry(), faceMat); faceHi.renderOrder = 2;
const arrow = new THREE.ArrowHelper(new V3(0, 1, 0), new V3(), .5, 0xffffff, .12, .07);
const mirrorMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: .07, side: THREE.DoubleSide, depthWrite: false });
const mirrors = { x: new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2).rotateY(Math.PI / 2), mirrorMat), y: new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2).rotateX(Math.PI / 2), mirrorMat), z: new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), mirrorMat) };
const helpers = new THREE.Group();
helpers.add(selLines, selPts, faceHi, arrow, mirrors.x, mirrors.y, mirrors.z);

function skinCfg() { return VARIANTS[S.skin].three; }
function updateHelpers() {
  objs.forEach(o => { o.mesh.material = matFor(o); o.mesh.visible = !o.hidden; });
  const o = cur(), cfg = skinCfg();
  if (!o) { if (helpers.parent) helpers.parent.remove(helpers); return; }
  if (helpers.parent !== o.mesh) o.mesh.add(helpers);
  const mc = new THREE.Color(cfg.m3[S.mode]), dim = new THREE.Color(cfg.dim), dot = new THREE.Color(cfg.dot);
  const E = edgesOf(o.poly), pos = [], col = [];
  let selEdges = new Set();
  if (S.mode === 'edge') selEdges = S.comp;
  if (S.mode === 'face') { const fs = [...S.comp].map(i => o.poly.f[i]).filter(Boolean); const set = new Set(); fs.forEach(f => f.forEach((a, k) => { const b = f[(k + 1) % f.length]; set.add(a < b ? a + '_' + b : b + '_' + a); })); E.forEach((e, i) => { if (set.has(e[0] + '_' + e[1])) selEdges.add(i); }); }
  E.forEach(([a, b], i) => {
    const A = o.poly.v[a], B = o.poly.v[b]; pos.push(A.x, A.y, A.z, B.x, B.y, B.z);
    const c = S.mode === 'object' || selEdges.has(i) ? mc : dim; col.push(c.r, c.g, c.b, c.r, c.g, c.b);
  });

  selLines = new LineSegments2(g, lineMat); selLines.renderOrder = 3; helpers.add(selLines);

  selPts.visible = S.mode === 'vertex';
  if (selPts.visible) {
    const p = [], c = [];
    const used = new Set(o.poly.f.flat());
    o.poly.v.forEach((q, i) => { if (!used.has(i)) return; p.push(q.x, q.y, q.z); const k = S.comp.has(i) ? mc : dot; c.push(k.r, k.g, k.b); });
    selPts.geometry.dispose(); selPts.geometry = new THREE.BufferGeometry();
    selPts.geometry.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    selPts.geometry.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
    ptsMat.size = 8;
  }
  faceHi.visible = S.mode === 'face' && S.comp.size > 0;

    case 'close': S.panel = null; S.sympop = false; break;
